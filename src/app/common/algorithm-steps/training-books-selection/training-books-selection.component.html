<div class="training-books">
  <div class="actions">
    <button mat-stroked-button (click)="selectAll(true)" [disabled]="disabled" i18n>Select all of this notation</button>
    <button mat-stroked-button (click)="selectAll(false)" [disabled]="disabled" i18n>Select all</button>
    <button mat-stroked-button (click)="selectNone()" [disabled]="disabled" i18n>Select none</button>
    <span class="summary" i18n>{{ selectedBooks }} books, {{ selectedPages }} usable pages selected</span>
  </div>

  @if (loading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <div class="table-container">
    <table mat-table [dataSource]="(books | async)" class="mat-elevation-z2">
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let b">
          <mat-checkbox [checked]="isSelected(b)" [disabled]="!isSelectable(b)"
                        (change)="toggle(b)"></mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef i18n>Book</th>
        <td mat-cell *matCellDef="let b">
          {{ b.name }}
          @if (isCurrentBook(b)) {
            <span class="hint" i18n>(trained book, always included)</span>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="style">
        <th mat-header-cell *matHeaderCellDef i18n>Notation style</th>
        <td mat-cell *matCellDef="let b" [class.foreign-style]="isForeignStyle(b)"
            [matTooltip]="isForeignStyle(b) ? 'This book is written in a different notation than the trained book' : ''"
            i18n-matTooltip>
          {{ styleName(b.style) }}
        </td>
      </ng-container>

      <ng-container matColumnDef="pages">
        <th mat-header-cell *matHeaderCellDef i18n>Pages</th>
        <td mat-cell *matCellDef="let b">{{ b.pages }}</td>
      </ng-container>

      <ng-container matColumnDef="usablePages">
        <th mat-header-cell *matHeaderCellDef>
          <span i18n>Usable pages</span>
          <mat-icon [matTooltip]="'Pages that are locked for ' + (locks | async).join(', ') + ' and can therefore be used as ground truth for this step'"
                    i18n-matTooltip>help_outline</mat-icon>
        </th>
        <td mat-cell *matCellDef="let b" [class.no-data]="b.usablePages === 0">{{ b.usablePages }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.selected-row]="isSelected(row)"></tr>
    </table>
  </div>
</div>
