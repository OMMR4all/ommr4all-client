<div class="pis-preview">
  <div class="preview-toolbar">
    <label class="zoom-label" for="pisPreviewZoom" i18n>Zoom</label>
    <input id="pisPreviewZoom" class="zoom-range" type="range" min="0.25" max="6" step="0.25" [(ngModel)]="zoom">
    <span class="zoom-label">{{ zoom }}&times;</span>
  </div>

  @if (loading) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }
  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  <div class="preview-viewport" (wheel)="onWheel($event)">
    @if (page) {
      <svg [attr.viewBox]="viewBox" [style.width.%]="zoom * 100" preserveAspectRatio="xMinYMin meet">
        <g app-secured-svg-image
          [src]="imageUrl"
          [width]="page.imageWidth"
          [height]="page.imageHeight">
        </g>
        @for (line of musicLines; track line.id) {
          <g app-pis-area-view [line]="line" [editorTool]="tool"></g>
          <g app-staff-lines-view [staffLines]="line.staffLines" [editorTool]="tool"></g>
          <g app-symbols-view [staff]="line" [editorTool]="tool"></g>
        }
      </svg>
    }
  </div>
</div>
