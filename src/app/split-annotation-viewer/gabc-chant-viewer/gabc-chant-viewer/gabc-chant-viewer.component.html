@if (getGabcText) {
  <div
    id="gabc-chant-viewer"
    [style.left]="left + 'px'"
    [style.top]="top + 'px'"
    [style.visibility]="visible ? 'visible' : 'hidden'">

    <app-exsurge-wrapper
      [source]="getGabcText"
      [singleLine]="true"
      (rendered)="onRendered($event)">
    </app-exsurge-wrapper>
  </div>
}
